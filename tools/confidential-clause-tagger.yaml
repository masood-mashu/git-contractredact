name: confidential-clause-tagger
version: 1.0.0
description: "Flags non-disclosure, intellectual property transfer, and non-solicitation clauses"
input_schema:
  type: object
  properties:
    clause_text:
      type: string
      description: "Contract clause text to inspect"
  required:
    - clause_text
implementation:
  type: script
  path: confidential_clause_tagger.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
