spec_version: "0.1.0"
name: git-contractredact
version: 1.0.0
description: "Autonomous Legal Document PII Masking, Confidentiality Redaction & Tamper-Proof Sealing Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - legal-redaction-standards
  - cryptographic-audit-seals

tools:
  - pii-entity-masker
  - confidential-clause-tagger
  - redaction-hash-verifier

runtime:
  max_turns: 50
  timeout: 120

tags:
  - legal
  - contract-redaction
  - pii-masking
  - gdpr-compliance
  - passport-challenge

metadata:
  passport_id: "aps-contractredact-01"
  passport_category: "Legal"
